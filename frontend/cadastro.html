<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Criar Conta - La Cuisine Brasil</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-login">

<div class="container-auth">
    <div class="auth-card" style="margin-top: 50px;">

        <div class="header-auth-card">
        </div>

        <h2>Criar Nova Conta</h2>

        <div id="mensagem-erro"></div>

        <form id="form-cadastro">

            <div class="input-group">
                <label for="nome_usuario">Nome Completo</label>
                <input
                        type="text"
                        id="nome_usuario"
                        name="nome_usuario"
                        required>
            </div>

            <div class="input-group">
                <label for="email_usuario">E-mail</label>
                <input
                        type="email"
                        id="email_usuario"
                        name="email_usuario"
                        required>
            </div>

            <div class="input-group">
                <label for="senha_usuario">Senha</label>
                <input
                        type="password"
                        id="senha_usuario"
                        name="senha_usuario"
                        required>
            </div>

            <button type="submit" class="btn-primary">
                Registar Conta
            </button>

        </form>

        <p style="margin-top:20px; font-size:14px;">
            Já tem uma conta?
            <a href="login.html"
               style="color:#E67E22; text-decoration:none;">
                Faça Login
            </a>
        </p>

        <a href="index.html" class="btn-voltar">
            <span class="icon-seta">←</span>
            <span>Voltar para a Home</span>
        </a>

    </div>
</div>

<footer style="background: #2b1506; color: white; text-align: center; padding: 40px 0; margin-top: 50px;">
    <p>&copy; 2026 La Cuisine Brasil - Todos os direitos reservados.</p>
    <p style="font-size: 12px; color: #888; margin-top: 10px;"></p>
</footer>

<script src="assets/javascript/config.js"></script>
<script src="assets/javascript/cadastro.js"></script>

</body>
</html>
