<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar perfil de usuário</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-login">

<nav class="navbar">
    <a href="index.html">
        <div class="logo">La Cuisine Brasil</div>
    </a>

    <form class="search-container">
        <input type="text"
               placeholder="Pesquisar receitas..."
               required>
    </form>

    <ul class="nav-links" id="menu">
    </ul>
</nav>

<div class="container-auth">
    <div class="auth-card" style="width: 500px; margin-top: 50px;">

        <h2>Editar Perfil de Usuário</h2>

        <form id="form-editar-usuario">

            <div class="input-group">
                <label for="nome_usuario">Nome</label>
                <input
                        type="text"
                        id="nome_usuario"
                        name="nome_usuario"
                        required>
            </div>

            <div class="input-group">
                <label for="email_usuario">E-mail</label>
                <input
                        type="email"
                        id="email_usuario"
                        name="email_usuario"
                        required>
            </div>

            <button type="submit" class="btn-primary">
                Salvar Alterações
            </button>

        </form>

    </div>
</div>

<footer style="background: #2b1506; color: white; text-align: center; padding: 40px 0; margin-top: 50px;">
    <p>&copy; 2026 La Cuisine Brasil - Todos os direitos reservados.</p>
    <p style="font-size: 12px; color: #888; margin-top: 10px;">
    </p>
</footer>

<script src="assets/javascript/config.js"></script>
<script src="assets/javascript/menu.js"></script>
<script src="assets/javascript/editar_usuario.js"></script>

</body>
</html>
